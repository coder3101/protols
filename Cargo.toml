[package]
name = "protols"
description = "Language server for proto3 files"
version = "0.13.4"
edition = "2024"
license = "MIT"
homepage = "https://github.com/coder3101/protols"
repository = "https://github.com/coder3101/protols"
readme = "README.md"
keywords = ["lsp", "proto"]

exclude = ["assets/*", "sample/*"]

[dependencies]
async-lsp = { version = "0.2", features = ["tokio"] }
futures = "0.3"
tokio = { version = "1.52", features = ["time", "full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.26"
tracing-appender = "0.2"
tree-sitter-proto = "0.4"
walkdir = "2.5"
hard-xml = "1.41"
tempfile = "3.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
basic-toml = "0.1"
pkg-config = "0.3"
clap = { version = "4.6", features = ["derive"] }
const_format = "0.2"

[dev-dependencies]
insta = { version = "1.47", features = ["yaml", "redactions"] }

[profile.release]
strip = "debuginfo" # Removes heavy debug data but keeps function names for panic logs
lto = true          # Enables Link-Time Optimization for cross-crate improvements
codegen-units = 1   # Maximizes LLVM optimization passes
